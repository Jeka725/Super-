name: Build SUPER

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Build firmware
        run: pio run -e esp32-s3-st7735
      - name: Verify firmware
        run: |
          test -s .pio/build/esp32-s3-st7735/firmware.bin
          test -s .pio/build/esp32-s3-st7735/bootloader.bin
          test -s .pio/build/esp32-s3-st7735/partitions.bin
          ls -lh .pio/build/esp32-s3-st7735/*.bin
      - name: Package firmware
        uses: actions/upload-artifact@v4
        with:
          name: SUPER-ESP32-S3-ST7735
          if-no-files-found: error
          path: |
            .pio/build/esp32-s3-st7735/firmware.bin
            .pio/build/esp32-s3-st7735/bootloader.bin
            .pio/build/esp32-s3-st7735/partitions.bin
